<!doctype html>
<html lang="es" data-tema="dia">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f2ed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>FinanzasObra</title>
  <meta name="description" content="Caja, gastos y deudas de obra, con o sin señal" />
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee en claro
    // al abrir en modo noche. Misma clave y valores que src/presentation/tema/tema.js.
    (function () {
      try {
        var p = localStorage.getItem('finanzasobra.tema');
        var oscuro = p === 'noche' || (p === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-tema', oscuro ? 'noche' : 'dia');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && oscuro) meta.setAttribute('content', '#121110');
      } catch (e) { /* almacenamiento bloqueado: queda el tema día */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
